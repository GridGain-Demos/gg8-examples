# Per-test configuration mappings consumed by CE's GridAbstractExamplesTest at
# runtime. The base class hard-codes this path (modules/core/src/test/config/
# examples.properties) and resolves it relative to IGNITE_HOME, so the file
# must exist where IGNITE_HOME points (the repo root, set via surefire).
#
# Unmatched lookups fall back to examples/config/example-ignite.xml.
DataRegionExample=examples/config/example-data-regions.xml
