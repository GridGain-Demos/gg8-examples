name: build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  install-ce:
    name: Install GridGain CE
    runs-on: ubuntu-latest
    outputs:
      ignite-version: ${{ steps.ce-version.outputs.value }}
    steps:
      - name: Checkout GridGain CE
        uses: actions/checkout@v4
        with:
          repository: gridgain/gridgain
          path: gridgain
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: m2-${{ runner.os }}-

      - name: Install native build tools required by CE
        run: |
          sudo apt-get update -qq
          # cmake — invoked by cmake-maven-plugin in ignite-numa-allocator
          # libnuma-dev — provides libnuma.so + headers for ignite-numa-allocator
          # build-essential is preinstalled on ubuntu-latest runners
          sudo apt-get install -y --no-install-recommends cmake libnuma-dev

      - name: Install CE artifacts (full build, skip tests)
        working-directory: gridgain
        run: mvn -B -ntp -DskipTests -Pall-java install

      - name: Resolve CE version
        id: ce-version
        working-directory: gridgain
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "value=$v" >> "$GITHUB_OUTPUT"

  build:
    name: gg8-examples
    needs: install-ce
    runs-on: ubuntu-latest

    env:
      IGNITE_VERSION: ${{ needs.install-ce.outputs.ignite-version }}

    steps:
      - name: Checkout gg8-examples
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore local Maven repository (CE artifacts from install-ce)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: m2-${{ runner.os }}-

      - name: Build and run self-tests
        run: mvn -B -ntp clean test -Dmaven.test.failure.ignore=true

      - name: Surefire summary
        if: always()
        run: |
          set +e
          fail=0
          # Surefire .txt reports have the "Tests run:" line at line 4 (after
          # a dashes / "Test set: ..." / dashes header). Match anywhere in
          # the file so a non-zero failure/error count never slips by.
          for f in $(find . -path '*/surefire-reports/*.txt' -size +0c); do
            grep -qE 'Failures: [1-9]|Errors: [1-9]' "$f" || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
            fail=1
          done
          exit $fail

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7
